<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="container">
    <nav>
      <a href="/" class="site-title">{{site_title}}</a>
      <span class="lang-switch">{{nav_lang_switch}}</span>
    </nav>
  </div>
</header>

<main class="container">
  <article>
    <h1>{{title}}</h1>
    <div class="meta">{{date}}</div>
    <div class="content">
{{content}}
    </div>
  </article>
</main>

<footer>
  <div class="container">
    <p>{{site_description}}</p>
    <p>Powered by CXO</p>
  </div>
</footer>
</body>
</html>
